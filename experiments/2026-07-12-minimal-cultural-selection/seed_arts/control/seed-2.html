<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#64c9e8;font-family:Georgia,serif}
body{display:grid;place-items:center} .field{width:72vmin;height:72vmin;border:2px solid #64c9e8;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 80px #64c9e855;position:relative}
.field:before,.field:after{content:"";position:absolute;inset:12%;border:1px solid #64c9e899;transform:rotate(45deg)}
.field:after{inset:27%;transform:rotate(22.5deg);background:#64c9e818}
</style></head><body><div class="field"></div></body></html>
