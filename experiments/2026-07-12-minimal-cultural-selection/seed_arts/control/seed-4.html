<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#d5bf55;font-family:Georgia,serif}
body{display:grid;place-items:center} .field{width:72vmin;height:72vmin;border:2px solid #d5bf55;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 80px #d5bf5555;position:relative}
.field:before,.field:after{content:"";position:absolute;inset:12%;border:1px solid #d5bf5599;transform:rotate(45deg)}
.field:after{inset:27%;transform:rotate(22.5deg);background:#d5bf5518}
</style></head><body><div class="field"></div></body></html>
