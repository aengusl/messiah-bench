[project]
name = "art-tournament"
version = "0.1.0"
description = "Blind judge art tournament: pairwise ELO over simulation artworks"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "anthropic>=0.69",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
